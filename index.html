<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do List</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>My To-Do List</h1>
      <p id="counter" class="counter" aria-live="polite">No tasks yet</p>
    </header>

    <form id="task-form" class="task-form" autocomplete="off">
      <label for="task-input" class="sr-only">New task</label>
      <input id="task-input" type="text" placeholder="What do you need to do?" maxlength="120" />
      <button type="submit" id="add-btn">Add</button>
    </form>
    <p id="error" class="error" role="alert" hidden>Please type a task first.</p>

    <div class="filters" role="group" aria-label="Filter tasks">
      <button type="button" class="filter active" data-filter="all">All</button>
      <button type="button" class="filter" data-filter="active">Active</button>
      <button type="button" class="filter" data-filter="completed">Completed</button>
    </div>

    <ul id="task-list" class="task-list"></ul>
    <p id="empty" class="empty" hidden>Nothing here. Add a task above.</p>

    <footer class="app-footer">
      <button type="button" id="clear-completed" class="link-btn">Clear completed</button>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
